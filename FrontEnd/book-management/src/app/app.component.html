<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Book Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>

<div class="container mt-5">
  <h1 class="mb-3 text-center">Welcome to the Book Management System</h1>
  <p class="text-center mb-5">This application allows you to manage your book collection.</p>

  <div class="card shadow-sm p-4">
    <h2 class="mb-4">Book Management</h2>

    <!-- Book Form -->
    <form (submit)="onSubmit()">
      <div class="mb-3">
        <label for="title" class="form-label">Title</label>
        <input id="title" type="text" class="form-control" [(ngModel)]="book.title" name="title" required>
      </div>

      <div class="mb-3">
        <label for="author" class="form-label">Author</label>
        <input id="author" type="text" class="form-control" [(ngModel)]="book.author" name="author" required>
      </div>

      <div class="mb-3">
        <label for="isbn" class="form-label">ISBN</label>
        <input id="isbn" type="text" class="form-control" [(ngModel)]="book.isbn" name="isbn" required>
      </div>

      <div class="mb-3">
        <label for="publicationDate" class="form-label">Publication Date</label>
        <input id="publicationDate" type="date" class="form-control" [(ngModel)]="book.publicationDate" name="publicationDate" required>
      </div>

      <button type="submit" class="btn btn-primary">Add Book</button>
    </form>

    <hr class="my-4">

    <!-- Book List -->
    <h3 class="mb-3">Book List</h3>
    <ul class="list-group">
      <li class="list-group-item d-flex justify-content-between align-items-center" *ngFor="let b of books">
        <div>
          <strong>{{ b.title }}</strong> by {{ b.author }} ({{ b.isbn }}) - {{ b.publicationDate | date:'shortDate' }}
        </div>
        <button class="btn btn-sm btn-danger" (click)="deleteBook(b.id)">Delete</button>
      </li>
    </ul>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
